rules:
  - id: python-dynamic-eval
    languages: [python]
    severity: ERROR
    message: Dynamic code execution requires removal or security review.
    pattern-either:
      - pattern: eval($X, ...)
      - pattern: exec($X, ...)
  - id: python-shell-execution
    languages: [python]
    severity: ERROR
    message: Shell execution requires removal or security review.
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
  - id: python-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS verification must remain enabled.
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Unsafe deserialization requires security review.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
  - id: python-jwt-signature-disabled
    languages: [python]
    severity: ERROR
    message: JWT signature verification must remain enabled.
    pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
  - id: javascript-dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code execution requires removal or security review.
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)
  - id: javascript-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS verification must remain enabled.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: 'new $AGENT({..., rejectUnauthorized: false, ...})'
